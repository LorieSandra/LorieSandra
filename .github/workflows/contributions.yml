name: Graphique de contributions

on:
  schedule:
    - cron: "0 4 * * *"   # tous les jours à 4 h (UTC)
  workflow_dispatch:       # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Générer le graphique aux couleurs du profil
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contributions-dark.svg?palette=github-dark&color_snake=#38E1F5&color_dots=#161B3D,#1E3A8A,#3B5BDB,#6D4BD8,#8B5CF6
            dist/contributions-light.svg?color_snake=#5B3FD6&color_dots=#EBEDF0,#C7D2FE,#818CF8,#6366F1,#4338CA

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
