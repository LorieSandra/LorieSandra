name: Statistiques GitHub

on:
  schedule:
    - cron: "0 5 * * *"   # tous les jours à 5 h (UTC)
  workflow_dispatch:       # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Statistiques générales
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/general.svg
          base: header, activity, community, repositories
          config_timezone: Europe/Paris

      - name: Langages les plus utilisés
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/languages.svg
          base: ""
          config_timezone: Europe/Paris
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage

      - name: Calendrier des contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/calendar.svg
          base: ""
          config_timezone: Europe/Paris
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
